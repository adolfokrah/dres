name: dres
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.4+5

environment:
  sdk: ^3.10.4

dependencies:
  dio: ^5.9.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.0
  flutter_secure_storage: ^10.0.0
  get_it: ^9.2.0
  shared_preferences: ^2.5.4
  go_router: ^17.0.1
  cupertino_icons: ^1.0.8
  phosphor_flutter: ^2.1.0
  equatable: ^2.0.7
  cached_network_image: ^3.4.1
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  url_launcher: ^6.2.5
  webview_flutter: ^4.10.0
  image_picker: ^1.2.1
  wechat_assets_picker: ^10.1.0
  wechat_camera_picker: ^4.4.0
  share_plus: ^12.0.1
  app_links: ^7.0.0
  restart_app: ^1.3.2
  firebase_messaging: ^16.1.0
  flutter_local_notifications: ^19.5.0
  flutter_overlay_loader: ^2.0.0
  loader_overlay: ^5.0.0
  photo_view: ^0.15.0
  reorderables: ^0.6.0
  flutter_image_compress: ^2.3.0
  fl_chart: ^1.0.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/images/photo-tips/

  fonts:
    - family: AlbraSerif
      fonts:
        - asset: assets/fonts/AlbraTRIAL-Light.otf
          weight: 300
        - asset: assets/fonts/AlbraTRIAL-Regular.otf
          weight: 400
        - asset: assets/fonts/AlbraTRIAL-Regular-Italic.otf
          weight: 400
          style: italic
        - asset: assets/fonts/AlbraTRIAL-Medium.otf
          weight: 500
        - asset: assets/fonts/AlbraTRIAL-Medium-Italic.otf
          weight: 500
          style: italic
        - asset: assets/fonts/AlbraTRIAL-Semi.otf
          weight: 600
        - asset: assets/fonts/AlbraTRIAL-Bold.otf
          weight: 700
        - asset: assets/fonts/AlbraTRIAL-Bold-Italic.otf
          weight: 700
          style: italic
        - asset: assets/fonts/AlbraTRIAL-Black.otf
          weight: 900

    - family: HelveticaNow
      fonts:
        - asset: assets/fonts/HelveticaNowText-Thin.ttf
          weight: 100
        - asset: assets/fonts/HelveticaNowText-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/HelveticaNowText-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/HelveticaNowText-ExtLtIta.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/HelveticaNowText-Light.ttf
          weight: 300
        - asset: assets/fonts/HelveticaNowText-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/HelveticaNowText-Regular.ttf
          weight: 400
        - asset: assets/fonts/HelveticaNowText-RegIta.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/HelveticaNowText-Medium.ttf
          weight: 500
        - asset: assets/fonts/HelveticaNowText-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/HelveticaNowText-Bold.ttf
          weight: 700
        - asset: assets/fonts/HelveticaNowText-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/HelveticaNowText-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/HelveticaNowText-ExtBdIta.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/HelveticaNowText-Black.ttf
          weight: 900
        - asset: assets/fonts/HelveticaNowText-BlackItalic.ttf
          weight: 900
          style: italic

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo.png"
  remove_alpha_ios: true
